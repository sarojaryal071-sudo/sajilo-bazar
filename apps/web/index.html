<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- interactive-widget=resizes-visual: without it, recent mobile Chrome
         defaults to resizing the LAYOUT viewport (not just the visual one)
         when the on-screen keyboard opens - which drags every
         `position: fixed` element (BottomNav, HamburgerMenu, etc.) up to
         float above the keyboard instead of staying pinned to the real
         bottom of the screen and getting covered by it like normal
         content. This restores that expected behavior site-wide. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual"
    />
    <meta name="theme-color" content="#0d9488" />
    <meta
      name="description"
      content="Sajilo Bazar - book trusted local workers for home services in Nepal."
    />
    <title>Sajilo Bazar</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
